name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      translation_locale:
        description: Choose none for an iOS build, or a language for translation drafts only
        type: choice
        options: [none, all, es, fr, de, pt-BR]
        default: none
      translation_dry_run:
        description: Estimate translation volume without calling the provider
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.translation_locale == 'none' }}
    name: Build PipeBoss AI
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | head -n 1 || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Xcode 26 is required for App Store-ready builds."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iPhoneOS SDK $SDK_VERSION"

          XCODE_VERSION="$(xcodebuild -version | sed -n 's/^Xcode //p' | head -n 1)"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::App Store Connect requires Xcode 26 or later. Selected: $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi

      - name: Install iOS 26 platform
        run: |
          set -euo pipefail
          xcodebuild -downloadPlatform iOS -architectureVariant arm64

      - name: Validate localization and App Store metadata
        run: |
          set -euo pipefail
          swiftc PipeBossAI/Core/Models.swift PipeBossAI/Content/AppContent.swift tools/localization/main.swift -o /tmp/export-content
          /tmp/export-content tools/localization/source.json
          python3 tools/localization/localize.py validate
          python3 tools/localization/validate_metadata.py
          node --test tools/localization/test_metadata.mjs
          python3 -m unittest discover -s tools/localization -p 'test_*.py'
          swiftc PipeBossAI/Core/Models.swift PipeBossAI/Core/TrainingProgress.swift PipeBossAI/Content/AppContent.swift PipeBossAI/Services/Localization.swift tools/localization/tests/main.swift -o /tmp/test-localization
          /tmp/test-localization
          swiftc -parse-as-library PipeBossAI/Core/*.swift PipeBossAI/Content/AppContent.swift PipeBossAI/Services/Localization.swift PipeBossAI/Services/ProgressStore.swift PipeBossAI/Services/Haptics.swift PipeBossAI/ViewModels/*.swift tools/training-tests/main.swift -o /tmp/test-training
          /tmp/test-training

      - name: List schemes
        run: xcodebuild -list -project PipeBossAI.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PipeBossAI.xcodeproj \
            -scheme PipeBossAI \
            -configuration Debug \
            -derivedDataPath /tmp/PipeBossBuild \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release for iOS without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project PipeBossAI.xcodeproj \
            -scheme PipeBossAI \
            -configuration Release \
            -derivedDataPath /tmp/PipeBossBuild \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile native StoreKit integration tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PipeBossAI.xcodeproj \
            -scheme PipeBossAI \
            -configuration Debug \
            -derivedDataPath /tmp/PipeBossBuild \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Test StoreKit purchases and entitlement changes on iPhone and iPad
        timeout-minutes: 8
        run: bash tools/test-storekit.sh /tmp/PipeBossBuild /tmp/PipeBossPurchaseTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StoreKit-test-results
          path: /tmp/PipeBossPurchaseTests

      - name: Capture native iPhone and iPad screens
        if: ${{ always() && !cancelled() }}
        run: bash tools/capture-simulator-screenshots.sh /tmp/PipeBossBuild/Build/Products/Debug-iphonesimulator/PipeBossAI.app /tmp/PipeBossScreenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-iPhone-iPad-screenshots
          path: /tmp/PipeBossScreenshots

  translation_drafts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_locale != 'none' }}
    uses: ./.github/workflows/localization.yml
    with:
      locale: ${{ inputs.translation_locale }}
      dry_run: ${{ inputs.translation_dry_run }}
    secrets:
      DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
